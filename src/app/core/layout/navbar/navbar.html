<nav class="surface-1 border-theme-1 flex h-16 items-center justify-between border-b px-3">
  <!-- Logo -->
  <button
    (click)="goToHome()"
    type="button"
    class="bg-transparent border-none p-0 cursor-pointer"
    style="all: unset; cursor: pointer"
  >
    <img
      src="assets/Geomatikk-logo.png"
      alt="Geomatikk"
      class="navbar-logo h-[clamp(0.5rem,8vw,2rem)]"
    />
  </button>

  <!-- Desktop:Hamburgermenu and User -->
  <div class="hidden sm:flex items-center ml-auto gap-2">
    <button
      pButton
      type="button"
      severity="secondary"
      class="p-0 inline-flex items-center justify-center min-w-[2.5rem] min-h-[2.5rem] rounded-full border border-[color:var(--border-2)] shadow-none hover:brightness-105 dark:hover:brightness-95 focus-visible:outline focus-visible:outline-2 focus-visible:outline-[color:var(--focus-ring)] cursor-pointer"
      style="background-color: var(--surface-2); color: var(--text-1)"
      (click)="menuOpen = true"
    >
      <i class="navbar-action-icon pi pi-bars" style="font-size: 1.4rem"></i>
      <span class="sr-only">{{ 'navbar.openMenu' | translate }}</span>
    </button>

    <button
      pButton
      type="button"
      severity="secondary"
      class="p-0 inline-flex items-center justify-center min-w-[2.5rem] min-h-[2.5rem] rounded-full border border-[color:var(--border-2)] shadow-none hover:brightness-105 dark:hover:brightness-95 focus-visible:outline focus-visible:outline-2 focus-visible:outline-[color:var(--focus-ring)] cursor-pointer"
      style="background-color: var(--surface-2); color: var(--text-1)"
    >
      <i class="navbar-action-icon pi pi-user" style="font-size: 1.4rem"></i>
      <span class="sr-only">{{ 'navbar.profile' | translate }}</span>
    </button>
  </div>

  <!-- Mobile: Hamburgermenu -->
  <div class="sm:hidden flex items-center gap-2 ml-auto">
    <button
      pButton
      type="button"
      severity="secondary"
      class="p-0 inline-flex items-center justify-center min-w-[2.5rem] min-h-[2.5rem] rounded-full border border-[color:var(--border-2)] shadow-none hover:brightness-105 dark:hover:brightness-95 focus-visible:outline focus-visible:outline-2 focus-visible:outline-[color:var(--focus-ring)] cursor-pointer"
      style="background-color: var(--surface-2); color: var(--text-1)"
      (click)="menuOpen = true"
    >
      <i class="navbar-action-icon pi pi-bars" style="font-size: 1.4rem"></i>
      <span class="sr-only">{{ 'navbar.openMenu' | translate }}</span>
    </button>
  </div>

  <!-- Sidebar  -->
  <p-drawer
    [(visible)]="menuOpen"
    position="right"
    [appendTo]="'body'"
    [style]="{ width: '16rem', height: '100%' }"
    [header]="'navbar.menu' | translate"
  >
    <div class="flex flex-col">
      @for (item of menuItems; track item.action; let last = $last) {
        <button
          (click)="onMenuSelect({ value: item })"
          class="text-theme-primary hover:bg-[color:var(--surface-2)] flex w-full items-center gap-3 px-2 py-4 text-left transition-colors"
          [class.border-b]="!last"
          [class.border-theme-2]="!last"
        >
          <i [class]="item.icon" style="font-size: 1.2rem"></i>
          <span class="font-bold">{{ item.label | translate }}</span>
        </button>
      }
    </div>
  </p-drawer>
</nav>
