<nav class="flex items-center justify-between px-3 h-16 bg-white border-b border-[#C8D1DA]">
  <!-- Logo -->
  <a routerLink="/">
    <img src="assets/Geomatikk-logo.png" alt="Geomatikk" class="h-[clamp(0.5rem,8vw,2rem)]" />
  </a>

  <!-- Desktop:Hamburgermenu and User -->
  <div class="hidden sm:flex items-center ml-auto -space-x-1">
    <p-button [text]="true" severity="secondary" (click)="menuOpen = true">
      <i class="pi pi-bars" style="font-size: 1.4rem"></i>
    </p-button>

    <p-button [text]="true" severity="secondary">
      <i class="pi pi-user" style="font-size: 1.4rem"></i>
    </p-button>
  </div>

  <!-- Mobile: Hamburgermenu -->
  <div class="sm:hidden flex items-center gap-2 ml-auto">
    <p-button [text]="true" [rounded]="true" severity="secondary" (click)="menuOpen = true">
      <i class="pi pi-bars" style="font-size: 1.4rem"></i>
    </p-button>
  </div>

  <!-- Sidebar  -->
  <p-drawer
    [(visible)]="menuOpen"
    position="right"
    [appendTo]="'body'"
    [style]="{ width: '16rem', height: '100%' }"
    header="Meny"
  >
    <div class="flex flex-col">
      @for (item of menuItems; track item.action; let last = $last) {
        <button
          (click)="onMenuSelect({ value: item })"
          class="flex items-center gap-3 w-full py-4 px-2 text-left hover:bg-slate-100 transition-colors"
          [class.border-b]="!last"
          [class.border-slate-300]="!last"
        >
          <i [class]="item.icon" style="font-size: 1.2rem"></i>
          <span class="font-bold">{{ item.label }}</span>
        </button>
      }
    </div>
  </p-drawer>
</nav>
