<div class="map-wrapper" [class.compact]="compact">
  <div id="assignment-map" class="map"></div>

  @if (mapError) {
    <div class="map-fallback">
      <div class="map-fallback-content">
        <p class="map-fallback-title">{{ 'map.loadError' | translate }}</p>
        <p class="map-fallback-message">{{ 'map.loadErrorMessage' | translate }}</p>
      </div>
    </div>
  }
</div>
