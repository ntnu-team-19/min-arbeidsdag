<div
  tabindex="0"
  role="button"
  class="block w-full overflow-hidden rounded-2xl border border-slate-200 bg-white text-left shadow-md transition active:scale-[0.99]"
  (click)="onCardClick()"
  (keydown)="onCardKeydown($event)"
>
  <div
    class="flex items-center gap-3 px-4 py-2 text-sm font-semibold text-slate-900"
    [ngClass]="currentStatus.barClass"
  >
    <span
      class="min-w-0 flex-1 truncate"
      [ngClass]="
        assignment.status === 'confirmed' || assignment.status === 'next'
          ? 'text-white'
          : 'text-black'
      "
    >
      {{ currentStatus.label }}
    </span>
    <div class="ml-auto shrink-0">
      @if (canToggleConfirmation) {
        <button
          type="button"
          class="inline-flex items-center rounded-full border border-slate-900/15 bg-white/75 px-3 py-1 text-[11px] font-bold uppercase tracking-wide text-slate-900 backdrop-blur-sm transition hover:bg-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-slate-900/60"
          (click)="onConfirmationToggle($event)"
        >
          {{ confirmationActionLabel }}
        </button>
      }
    </div>
  </div>

  <div class="flex items-center justify-between gap-4 p-4">
    <div class="flex min-w-0 items-start gap-4">
      <div class="shrink-0">
        <span
          [class]="currentStatus.icon"
          [ngClass]="currentStatus.iconClass"
          style="font-size: 3rem"
        ></span>
      </div>

      <div class="flex min-w-0 flex-1 flex-col sm:flex-row sm:gap-6">
        <div class="min-w-0 sm:w-[300px] sm:min-w-[300px]">
          <h3 class="text-xl font-bold text-slate-900 sm:truncate">
            {{ assignment.title }}
          </h3>
          <p class="mt-1 line-clamp-2 text-sm text-slate-600">
            {{ assignment.shortDescription || 'Ingen beskrivelse tilgjengelig' }}
          </p>
        </div>

        <div class="mt-3 space-y-1 text-sm text-slate-800 sm:mt-0">
          <p class="flex items-center gap-2">
            <i class="pi pi-clock shrink-0"></i>
            <span class="truncate">{{ assignment.time }}</span>
          </p>
          <p class="flex items-center gap-2">
            <i class="pi pi-map-marker shrink-0"></i>
            <span class="truncate">{{ assignment.address }}</span>
          </p>
          <p class="flex items-center gap-2">
            <i class="pi pi-phone shrink-0"></i>
            <span class="truncate">{{ assignment.phoneNumber || 'Ikke oppgitt' }}</span>
          </p>
        </div>
      </div>
    </div>
    <div class="flex justify-end">
      <i class="pi pi-chevron-right text-3xl text-[#1F4E79]"></i>
    </div>
  </div>
</div>
