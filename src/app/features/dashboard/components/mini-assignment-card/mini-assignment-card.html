<button
  type="button"
  class="surface-1 border-theme-2 block w-full rounded-2xl border p-0 text-left shadow-sm transition active:scale-[0.99]"
  (click)="onCardClick()"
>
  <div class="rounded-t-2xl px-4 py-1.5 text-xs font-semibold" [ngClass]="currentStatus.badgeClass">
    {{ currentStatus.label | translate }}
  </div>

  <div class="flex items-center justify-between gap-3 p-4">
    <div class="flex min-w-0 flex-1 items-start gap-3">
      <div
        class="surface-1 mt-1 flex h-7 w-7 shrink-0 items-center justify-center rounded-full border-4"
        [ngClass]="currentStatus.dotClass"
      >
        @if (sequenceNumber != null) {
          <span class="text-xs font-bold">
            {{ sequenceNumber }}
          </span>
        } @else {
          @switch (assignment.status) {
            @case ('completed') {
              <i class="pi pi-check text-sm"></i>
            }
            @case ('cancelled') {
              <i class="pi pi-times text-sm"></i>
            }
          }
        }
      </div>

      <div class="min-w-0">
        <h3 class="text-theme-primary truncate text-base font-bold">
          {{ assignment.address }}
        </h3>

        <div class="text-theme-secondary mt-1 flex flex-wrap items-center gap-x-3 gap-y-1 text-sm">
          <span class="flex items-center gap-1">
            <i class="pi pi-clock"></i>
            {{ assignment.time }}
          </span>

          <span class="flex items-center gap-1">
            <i class="pi pi-stopwatch"></i>
            {{ assignment.duration }}
          </span>
        </div>
      </div>
    </div>

    <button
      type="button"
      class="shrink-0 rounded-xl bg-[#547FA9] px-4 py-2 text-sm font-semibold text-white transition hover:brightness-95 active:scale-[0.98]"
      (click)="onDirectionsClick($event)"
    >
      {{ 'miniCard.showDirections' | translate }}
    </button>
  </div>
</button>
